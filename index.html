
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عدالة - منظومة الإدارة القانونية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable dark mode using class strategy
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#00796B', // Main Teal
                light: '#4DB6AC',  // Lighter Teal
                dark: '#004D40',   // Darker Teal
              },
              secondary: { // Using Greys for secondary
                DEFAULT: '#607D8B', // Blue Grey
                light: '#B0BEC5',  // Lighter Blue Grey
                dark: '#37474F',   // Darker Blue Grey
              },
              accent: {
                DEFAULT: '#FFC107', // Amber/Gold
                dark: '#FFA000',    // Darker Amber for hover/emphasis
              },
              success: '#4CAF50', // Green
              warning: '#FF9800', // Orange
              danger: '#F44336',  // Red
              info: '#2196F3',    // Blue
              'dm-background': '#102A3A', // Dark Desaturated Blue/Charcoal for dark mode body
              'dm-card': '#1E3C50',      // Darker Desaturated Blue/Charcoal for dark mode cards
              'dm-text': '#E0E7EF',       // Light Grey for dark mode text
              'neutral-bg': '#F5F7FA',   // Light mode background (very light grey)
              'neutral-card': '#FFFFFF', // Light mode card background (white)
              'neutral-text': '#37474F', // Light mode text (dark grey)
            },
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
              marhey: ['Marhey', 'Tajawal', 'sans-serif'],
            },
             boxShadow: {
              'card': '0 2px 8px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04)', // Softer shadow
              'card-hover': '0 8px 16px -3px rgba(0, 0, 0, 0.06), 0 4px 6px -4px rgba(0, 0, 0, 0.04)', // Slightly more pronounced hover
              'input-focus': '0 0 0 2px rgba(0, 121, 107, 0.4)', // primary.DEFAULT with opacity
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@300..700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Tajawal', sans-serif;
      }
      /* Apply dark mode based on class */
      html.dark body {
        background-color: #102A3A; /* dm-background */
        color: #E0E7EF; /* dm-text */
      }
      /* Light mode body default */
      body {
        background-color: #F5F7FA; /* neutral-bg */
        color: #37474F; /* neutral-text */
      }
    </style>
  <script type="importmap">
{

  }
}
</script>
